name: Core checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest numpy==1.26.4 scipy==1.15.3 soundfile==0.14.0 gpiozero==2.0.1
      - run: python -m pytest -q
      - run: bash -n scripts/setup.sh scripts/serve_llm.sh
  linux-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install uv==0.13.9
      - run: bash scripts/setup.sh
      - run: |
          .venv/bin/python scripts/prepare_llama.py
          .venv/bin/python scripts/whisper_cli.py --help
          .venv/bin/piper --help
          vendor/llama.cpp/build/bin/llama-server --version
      - name: Verify real voice chain on ARM64
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          .venv/bin/python scripts/download_models.py --include-demo-voice
          .venv/bin/python scripts/smoke_local.py
